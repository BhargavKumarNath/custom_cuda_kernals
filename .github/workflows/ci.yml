name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin ruff

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Lint with ruff
        run: ruff check .

      # ── Rust compile check (no CUDA needed) ──────────────────────────────
      # Builds the Rust/PyO3 layer and validates all FFI boundaries.
      # cargo check verifies the Rust crate compiles independently of nvcc.
      - name: Cargo check
        run: cargo check --release
        env:
          # Suppress build.rs nvcc invocations on a CPU-only runner.
          SKIP_CUDA_BUILD: "1"

      # ── maturin build (sdist — no nvcc required) ─────────────────────────
      # Produces a source distribution that confirms the maturin project
      # configuration, Cargo.toml, and pyproject.toml are all consistent.
      - name: maturin build (sdist)
        run: maturin build --sdist --out dist/
